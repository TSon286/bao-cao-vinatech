<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo cáo tiến độ triển khai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#060b3a;--panel:#0b1450;--card:#121c66;--rule:#2a3690;--text:#fff;--muted:#a9b4ea;--line:#cdd6ff;--gold:#ffd84d;
 --xong:#3ddc97;--hd:#7aa2ff;--dang:#ffb020;--cho:#ff7eb6;--dt:#b48cff;--kh:#5fd4ff;--cxn:#8a93c7;--risk:#ff6b6b;
 --base:#5fd4ff;--vtg:#ffd84d;--hrm:#12a37f;--work:#8b45f5;--acc:#2f6bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--kh)} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,.tabs,main{position:relative;z-index:1}
header{padding:16px 16px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0 0 4px;font-size:clamp(18px,1.9vw,26px);font-weight:700;letter-spacing:.2px}
.h1-sep{color:#5fd4ff;font-weight:500;margin:0 .15em}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.logos{flex:none;display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;padding:7px 14px}
.logos .vt{font-weight:700;font-size:17px;letter-spacing:.5px;color:#0b2a8a}.logos .vt span{color:#e02424}
.logos img{display:block;height:24px;width:auto}.logos i{width:1px;height:28px;background:#d5daf0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.tabs button{font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:7px 16px;cursor:pointer}
.tabs button:hover{color:var(--text);border-color:var(--line)}
.tabs button[aria-selected="true"]{color:#06103a;background:var(--line);border-color:var(--line)}
main{padding:12px 16px 40px;font-size:13px;max-width:1400px}
.upd{margin:0 0 12px;color:var(--muted);font-size:12.5px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 4px;font-size:14px}
.card .cs{margin:0 0 10px;font-size:12px;color:var(--muted)}
.mb{margin-bottom:12px}
.cxn{display:inline-block;font-size:11px;font-weight:600;color:var(--cxn);border:1px dashed var(--cxn);border-radius:5px;padding:0 6px;white-space:nowrap}

/* khu vực 1 */
.exec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px 28px;align-items:center;padding:18px 22px;border-radius:16px;margin-bottom:12px;
 background:radial-gradient(120% 140% at 0% 0%,rgba(255,216,77,.2),transparent 55%),linear-gradient(135deg,#16207a,#0b1450 60%,#0a2a4a);border:1.5px solid var(--gold);box-shadow:0 0 0 1px rgba(255,216,77,.22),0 0 32px rgba(255,216,77,.18)}
.ex-k{font-size:12px;font-weight:600;color:var(--gold)}
.ex-p{font-size:clamp(19px,2.1vw,26px);font-weight:700;margin:2px 0 8px;line-height:1.2}
.ex-meta{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.ex-meta b{color:var(--text);font-weight:600}
.ex-st{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--cxn);border:1px dashed var(--cxn);border-radius:999px;padding:3px 10px;margin-top:4px;max-width:100%;border-radius:12px}
.ex-r{font-size:14px;line-height:1.6}
.ex-r p{margin:0 0 6px}
.ex-r p:last-child{margin:0;font-size:12px;color:var(--muted)}
.ex-r b{color:var(--gold);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:14px;padding:12px 16px;min-width:0}
.kpi .k{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:34px;font-weight:700;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .sc{font-size:11.5px;color:var(--muted);line-height:1.4}
.kpi .bar{display:flex;gap:2px;height:7px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.07);margin:8px 0 6px}
.kpi .bar span{display:block;height:100%}

/* ma trận */
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--c)}
.leg i.u{background:repeating-linear-gradient(45deg,var(--rule) 0 3px,transparent 3px 6px);outline:1px solid var(--rule);outline-offset:-1px}
.leg i.q{background:transparent;outline:1.5px dashed var(--cxn);outline-offset:-2px}
.mxw{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:0 4px;width:100%;min-width:820px}
.mx th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:0 3px 2px;vertical-align:bottom;line-height:1.25}
.mx th:first-child{text-align:left}
.mx td{padding:0 2px}
.mx tr.gr td{padding:8px 4px 2px}
.mx .gname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:700}
.mx .gname i{display:inline-block;width:4px;height:14px;border-radius:2px;background:var(--c);align-self:center}
.mx .gname small{font-size:11.5px;font-weight:500;color:var(--muted)}
.mx .gname em{font-style:normal;font-size:11px;font-weight:500;color:var(--muted);padding:1px 7px;border:1px solid var(--rule);border-radius:5px}
.mx .gname em b{color:var(--text)}
.mrow{cursor:pointer}
.mrow td.mn{padding:6px 10px 6px 18px;border-radius:8px 0 0 8px;background:rgba(255,255,255,.03);white-space:nowrap}
.mrow:hover td.mn{background:rgba(255,255,255,.08)}
.mn b{display:block;font-size:12.5px;font-weight:600}
.mn small{display:block;font-size:10.5px;color:var(--muted)}
.cell{display:flex;align-items:center;justify-content:center;height:30px;border-radius:5px;background:color-mix(in srgb,var(--lv) 85%,transparent);font-size:10.5px;font-weight:700;color:#06103a;text-align:center;padding:0 4px;line-height:1.15}
.cell.chua{background:repeating-linear-gradient(45deg,rgba(138,147,199,.14) 0 3px,transparent 3px 6px);outline:1px solid var(--rule);outline-offset:-1px;color:var(--muted);font-weight:500}
.cell.cxn{background:transparent;outline:1.5px dashed var(--cxn);outline-offset:-2px;color:var(--cxn)}
.mx td.go{width:20px;color:var(--muted);text-align:center}
.mnote{font-size:11.5px;color:var(--muted);margin-top:8px}
.found{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:10px;padding:9px 12px;border-radius:10px;border:1px dashed var(--rule);background:rgba(47,107,255,.08);cursor:pointer;text-align:left;width:100%}
.found:hover{border-color:var(--line)}
.found .fb{font-size:11px;font-weight:700;color:#fff;background:var(--acc);border-radius:6px;padding:3px 8px;white-space:nowrap}
.found span{font-size:12px;color:var(--muted)}.found span b{color:var(--text)}

/* kết quả */
.res3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rs{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--c);border-radius:10px;padding:10px 12px;min-width:0}
.rs .rg{font-size:10.5px;font-weight:700;color:var(--c)}
.rs b{display:block;font-size:13px;margin:2px 0 6px;line-height:1.3}
.rs dl{margin:0;display:grid;gap:4px}
.rs dl div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;font-size:11.5px}
.rs dt{color:var(--muted)}.rs dd{margin:0}
.act{margin:10px 0 0;font-size:11.5px;color:var(--muted);padding:8px 10px;border:1px dashed var(--rule);border-radius:8px}
.act b{color:var(--text);font-weight:600}

/* bảng */
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px}
.card .tw{background:transparent}
table.tb{border-collapse:collapse;width:100%;font-size:12.5px}
.tb th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--rule);background:#0d1758;white-space:nowrap}
.tb td{padding:8px 10px;border-bottom:1px solid rgba(42,54,144,.6);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb td.n{color:var(--muted);width:30px;font-variant-numeric:tabular-nums}
.tb td.pr{width:56px}
.tb small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.tb .w{white-space:nowrap}
.tb.ov{min-width:860px}
.tb.ov td:first-child{font-weight:600}
.side{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:5px;color:#06103a;vertical-align:1px}
.side.b{background:var(--base)}.side.v{background:var(--vtg)}
.pri{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;color:#06103a;background:var(--gold)}
.st{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;color:#06103a;background:var(--lv)}
.st.q{background:transparent;color:var(--cxn);border:1px dashed var(--cxn)}
.mod{font-size:11px;color:var(--muted);white-space:nowrap}
.mod b{color:var(--c);font-weight:700}

/* timeline gọn */
.strip{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:11.5px;color:var(--muted)}
.strip .chip{display:inline-flex;gap:6px;align-items:center;padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--rule)}
.strip .chip b{color:var(--gold);font-variant-numeric:tabular-nums}
.strip .chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* chi tiết */
.dw{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}.dw>*,.exec>*{min-width:0}
.nav{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
.nav .ng2{font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 6px 4px;display:flex;align-items:center;gap:6px}
.nav .ng2 i{width:4px;height:12px;border-radius:2px;background:var(--c)}
.nav button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px 7px 18px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.nav button:hover{color:var(--text)}
.nav button[aria-current="true"]{color:#06103a;background:var(--line);font-weight:600}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--c)}
.dh h2{margin:2px 0 4px;font-size:22px}
.apps{display:flex;flex-wrap:wrap;gap:5px}
.apps span{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--card)}
.now{margin:12px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--rule);font-size:13px}
.now b{color:var(--gold);font-weight:600}
.stl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.st5{border-radius:9px;padding:8px 10px;background:color-mix(in srgb,var(--lv) 14%,var(--card));border:1px solid color-mix(in srgb,var(--lv) 55%,transparent);min-width:0}
.st5.chua{background:repeating-linear-gradient(45deg,rgba(138,147,199,.08) 0 4px,transparent 4px 8px);border-color:var(--rule)}
.st5.cxn{background:transparent;border:1.5px dashed var(--cxn)}
.st5 .sn{font-size:10.5px;color:var(--muted)}
.st5 b{display:block;font-size:12px;color:var(--lv);margin:2px 0}
.st5.chua b{color:var(--muted)}.st5.cxn b{color:var(--cxn)}
.st5 small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.f6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.f6 .bx{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px}
.f6 h4{margin:0 0 6px;font-size:12.5px}
.f6 ul{margin:0;padding-left:16px;font-size:12.5px;display:grid;gap:3px}
.f6 p{margin:0;font-size:12.5px}
.sec{font-size:13px;font-weight:600;margin:4px 0 8px}

/* vấn đề */
.isl{display:grid;gap:10px}
.is{display:grid;grid-template-columns:72px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px 14px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.is .id{font-size:12px;font-weight:700;color:var(--muted)}
.is .id .ky{display:block;margin-top:4px;font-size:10.5px;font-weight:700;color:#06103a;background:var(--risk);border-radius:4px;padding:1px 5px;width:max-content}
.is h4{margin:0 0 3px;font-size:13.5px}
.is .ds{font-size:12px;color:var(--muted)}
.is dl{margin:0;display:grid;gap:5px;font-size:12px}
.is dl div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px}
.is dt{color:var(--muted)}.is dd{margin:0}
.flt{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:16px 0 10px}
.flt .g{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.flt .g > span{font-size:12px;color:var(--muted);margin-right:2px}
.flt button{font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:4px 11px;cursor:pointer}
.flt button[aria-pressed="true"]{color:#06103a;background:var(--line);border-color:var(--line)}
.empty{padding:18px;color:var(--muted);text-align:center}
details.more{margin-top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:12px}
details.more summary{cursor:pointer;padding:11px 14px;font-size:13px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary small{color:var(--muted);font-weight:500}
details.more summary::after{content:"+";color:var(--muted)}
details.more[open] summary::after{content:"–"}
details.more .in{padding:0 14px 14px}
.ses{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.ses:last-child{border-bottom:0}
.ses .sd{font-weight:700;color:var(--gold)}
.ses .sd small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.ses .sg2{font-size:10.5px;font-weight:700;color:var(--c)}
.foot{color:var(--muted);font-size:11.5px;margin-top:14px}
.tip{position:fixed;z-index:30;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}

.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.num{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:14px;padding:14px 16px;min-width:0}
.num .k{font-size:12px;font-weight:600;color:var(--muted)}
.num .v{font-size:44px;font-weight:700;line-height:1.05;margin:6px 0 2px;color:var(--c);font-variant-numeric:tabular-nums;text-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.num .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px;text-shadow:none}
.num .s{font-size:11.5px;color:var(--muted)}
.ch3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.ch2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.rbox{display:flex;align-items:center;gap:16px}
.bring{width:128px;height:128px;flex:none}
.brv{font-size:22px;font-weight:700;fill:var(--text);font-family:inherit}
.brs{font-size:11px;fill:var(--muted);font-family:inherit}
.rleg{display:grid;gap:7px;font-size:12px;color:var(--muted)}
.rleg div{display:flex;align-items:center;gap:7px}
.rleg i{width:10px;height:10px;border-radius:3px;flex:none}
.rleg b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.rleg .rn{font-size:11.5px;border-top:1px dashed var(--rule);padding-top:6px}
.vb{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:170px;padding-top:4px}
.vbc{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.vbc b{font-size:20px;font-variant-numeric:tabular-nums}
.vbb{display:block;width:min(56px,70%);border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--bc,var(--hrm)),color-mix(in srgb,var(--bc,var(--hrm)) 40%,transparent))}
.vbc small{font-size:11.5px;color:var(--muted);text-align:center}
.chh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dist{display:flex;gap:2px;width:min(380px,100%);height:26px;border-radius:6px;overflow:hidden}
.dist span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#06103a;white-space:nowrap;overflow:hidden;padding:0 4px}
.sp{overflow-x:auto}
.sph,.spr{display:grid;grid-template-columns:minmax(180px,1.3fr) repeat(5,minmax(70px,1fr)) minmax(170px,1.2fr);gap:0;align-items:center;min-width:820px}
.sph{font-size:10.5px;color:var(--muted);text-align:center;padding:0 0 4px}
.sph span{display:flex;align-items:center;justify-content:center;gap:5px}
.sph span:first-child,.sph span:last-child{justify-content:flex-start}
.sph i{width:8px;height:8px;border-radius:50%}
.spg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:10px 0 4px;min-width:820px}
.spg i{width:4px;height:14px;border-radius:2px;background:var(--c)}
.spg small{font-weight:500;color:var(--muted);font-size:11.5px}
.spr{width:100%;text-align:left;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:9px;padding:6px 8px;margin-bottom:4px;cursor:pointer}
.spr:hover{border-color:var(--line);background:rgba(255,255,255,.06)}
.spn b{display:block;font-size:12.5px}.spn small{display:block;font-size:10.5px;color:var(--muted)}
.sps{position:relative;display:flex;justify-content:center;align-items:center;height:22px}
.sps::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--rule)}
.sps.dn::before,.sps.cu::before{background:var(--hd)}
.sps.cu::after{content:"";position:absolute;left:50%;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--rule)}.sps:nth-child(2)::before{left:50%}.sps.cu:nth-child(6)::after{display:none}.sps:nth-child(6)::before{right:50%}
.d{position:relative;z-index:1;display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--rule)}
.sps.dn .d{background:var(--hd);border-color:var(--hd)}
.sps.cu .d{width:20px;height:20px;background:var(--dang);border-color:#fff;box-shadow:0 0 0 4px rgba(255,176,32,.28),0 0 14px rgba(255,176,32,.6)}
.sps.pt .d{background:linear-gradient(90deg,var(--dt) 50%,var(--bg) 50%);border-color:var(--dt)}
.spl{font-size:11.5px;color:var(--dang);font-weight:600;padding-left:10px}
.sleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted);margin-top:8px}
.sleg span{display:inline-flex;align-items:center;gap:6px}
.sleg .d{width:12px;height:12px}
.sleg .d.dn{background:var(--hd);border-color:var(--hd)}
.sleg .d.cu{background:var(--dang);border-color:#fff}
.sleg .d.pt{background:linear-gradient(90deg,var(--dt) 50%,var(--bg) 50%);border-color:var(--dt)}
.ck{display:grid;gap:12px;margin-top:4px}
.ckh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.ckh b{font-size:13px}
.ckb{height:10px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.ckb span{display:block;height:100%;border-radius:999px}
.cnote{font-size:11px;color:var(--muted);margin:10px 0 0}
.ro{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:6px}
.rst{position:relative;text-align:center;padding:0 4px}
.rst::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--rule);z-index:0}
.rst:first-child::before{display:none}
.rst.xong::before,.rst.dang::before{background:var(--xong)}
.rd{position:relative;z-index:1;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:700;background:var(--bg);border:2px solid var(--rule);color:var(--muted)}
.rst.xong .rd{background:var(--xong);border-color:var(--xong);color:#06103a}
.rst.dang .rd{background:var(--dang);border-color:#fff;color:#06103a;box-shadow:0 0 0 4px rgba(255,176,32,.25)}
.rst b{display:block;font-size:12px;margin-top:8px;line-height:1.3}
.rst small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.sum2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;margin-bottom:12px}
@media (max-width:1100px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.ch3{grid-template-columns:1fr}.ch2,.sum2{grid-template-columns:1fr}}
@media (max-width:560px){.nums{grid-template-columns:1fr}.ro{grid-template-columns:1fr !important;gap:10px}.rst{display:grid;grid-template-columns:36px 1fr;text-align:left;align-items:center;column-gap:10px}.rst::before{display:none}.rst b{margin:0}.rst small{grid-column:2}.rbox{flex-direction:column;align-items:flex-start}}

.ig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.igc{border-top:3px solid var(--c)}
.igh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.igh h3{font-size:17px}
.ign{font-size:12px;color:var(--muted);white-space:nowrap}
.ign b{font-size:22px;color:var(--text);margin-right:2px}
.ign span{color:var(--risk);font-weight:600}
.il{display:grid;gap:6px}
.ir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 11px;border-radius:9px;background:var(--card);border-left:3px solid var(--rule)}
.ir.k{border-left-color:var(--risk)}
.irt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.irt b{font-size:13px}
.ism{font-size:10.5px;font-weight:600;color:var(--c)}
.irs{grid-row:1;grid-column:2;align-self:start}.ird{grid-column:1/-1;font-size:12px;color:var(--muted);margin-bottom:2px}
.irm{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;font-size:11.5px;color:var(--text)}
.irm em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.prop{font-size:11.5px;font-weight:600;color:var(--gold);border:1px dashed var(--gold);border-radius:999px;padding:3px 10px;white-space:nowrap}
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wd{background:rgba(255,255,255,.03);border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:120px;min-width:0}
.wd.on{border-color:var(--line)}
.wdh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wdh b{font-size:14px}.wdh span{font-size:12px;color:var(--gold);font-weight:700}
.wm{display:block;text-decoration:none;color:var(--text);padding:7px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 22%,var(--card));border-left:3px solid var(--c)}
.wm:hover{background:color-mix(in srgb,var(--c) 35%,var(--card))}
.wm span{display:block;font-size:10.5px;font-weight:700;color:var(--c)}
.wm b{display:block;font-size:12px;line-height:1.3;margin-top:2px}
.wspan{grid-column:1/-1;margin-bottom:2px}
.wnone{color:var(--rule);font-size:12px;text-align:center;padding-top:20px}
.mts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.mt{border-top:3px solid var(--c)}
.mth{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;margin-bottom:10px}
.mtd{text-align:center;padding:6px 10px;border-radius:9px;background:var(--card);border:1px solid var(--rule)}
.mtd b{display:block;font-size:16px}.mtd span{display:block;font-size:11.5px;color:var(--gold);font-weight:700}
.mtg{font-size:10.5px;font-weight:700;color:var(--c)}
.mth h3{margin:2px 0 4px}
.mtm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.mtl{margin:0;display:grid;gap:8px;font-size:12.5px}
.mtl dt{font-size:11px;color:var(--muted);margin-bottom:2px}
.mtl dd{margin:0}
.mtl ul{margin:0;padding-left:16px;display:grid;gap:2px}
@media (max-width:1100px){.mts{grid-template-columns:1fr}.irm{grid-template-columns:1fr}}
@media (max-width:860px){.ig{grid-template-columns:1fr}.wk{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.res3{grid-template-columns:1fr}.is{grid-template-columns:60px minmax(0,1fr)}.is dl{grid-column:2}}
@media (max-width:860px){.exec{grid-template-columns:1fr}.dw{grid-template-columns:minmax(0,1fr)}.nav{position:static}.f6{grid-template-columns:1fr}.stl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.is{grid-template-columns:1fr}.is dl{grid-column:auto}}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}#sky,.tabs{display:none}}
</style></head>

document.getElementById('hd-title').innerHTML=esc(META.client)+' × BASE <span class="h1-sep">|</span> '+esc((META.title||'Báo cáo tiến độ triển khai').toUpperCase());
document.getElementById('hd-sub').textContent='Kỳ báo cáo '+META.period+' · Dành cho '+(META.audience||'Ban Điều hành')+' · Dữ liệu tổng hợp đến hết '+META.asOf;
document.getElementById('hd-client').innerHTML=esc(META.client)+'<span>.</span>';

/* ---------- hàm chung ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function gOf(id){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].id===id)return GROUPS[i];return null;}
function gcol(g){return COL[g]||g;}
function cOf(m){var g=gOf(M[m].g);return g?gcol(g.c):'var(--acc)';}
function mlab(m){var g=gOf(M[m].g);return '<span class="mod" style="--c:'+cOf(m)+'"><b>'+(g?esc(g.name):'Nền tảng')+'</b> › '+esc(M[m].name)+'</span>';}
function fld(v){return (!v||v==='Cần xác nhận')?CXN:esc(v);}
function cell(s,i){var tip=PH[i]+' · '+S[s[0]][0]+(s[1]?': '+s[1]:'');
 if(s[0]==='chua')return '<span class="cell chua" data-tip="'+esc(tip)+'">—</span>';
 if(s[0]==='cxn')return '<span class="cell cxn" data-tip="'+esc(tip)+'">Chưa xác nhận</span>';
 return '<span class="cell" style="--lv:'+S[s[0]][1]+'" data-tip="'+esc(tip)+'">'+S[s[0]][0]+'</span>';}
function cnt(mods,i,k){return mods.filter(function(m){return M[m].st[i][0]===k;}).length;}
function who(list){return list.map(function(w){return '<span class="w" style="display:block"><span class="side '+w[0]+'">'+(w[0]==='b'?'Base':esc(CL))+'</span>'+(w[0]==='b'?'':esc(w[1]))+'</span>';}).join('');}
function legend(){return '<div class="leg">'+['hd','dang','cho','dt','kh','xong'].map(function(k){return '<span><i style="--c:'+S[k][1]+'"></i>'+S[k][0]+'</span>';}).join('')+'<span><i class="q"></i>Chưa xác nhận</span><span><i class="u"></i>Chưa bắt đầu</span></div>';}
function matrix(){
  var h='<div class="mxw"><table class="mx"><thead><tr><th>Phân hệ</th>'+PH.map(function(p){return '<th>'+p+'</th>';}).join('')+'<th></th></tr></thead><tbody>';
  GROUPS.forEach(function(g){var ms=g.mods,n=ms.length;
    h+='<tr class="gr"><td colspan="7"><div class="gname" style="--c:'+gcol(g.c)+'"><i></i>'+esc(g.name)+'<small>'+esc(g.full)+' · '+n+' phân hệ</small>'+
      '<em>Thiết lập xong <b>'+cnt(ms,1,'xong')+'/'+n+'</b></em><em>Đang rà soát <b>'+cnt(ms,2,'dang')+'/'+n+'</b></em><em>Vận hành <b>'+cnt(ms,4,'xong')+'/'+n+'</b></em></div></td></tr>';
    ms.forEach(function(m){h+='<tr class="mrow" data-open="'+m+'" tabindex="0"><td class="mn"><b>'+esc(M[m].name)+'</b><small>'+esc(M[m].apps.join(', '))+'</small></td>'+M[m].st.map(function(s,i){return '<td>'+cell(s,i)+'</td>';}).join('')+'<td class="go">›</td></tr>';});
  });
  return h+'</tbody></table></div>';
}
function rs(r){var c=gcol(r.c);return '<div class="rs" style="--c:'+c+'"><span class="rg">'+esc(r.label)+'</span><b>'+esc(r.title)+'</b><dl><div><dt>Đầu ra</dt><dd>'+esc(r.output)+'</dd></div><div><dt>Ý nghĩa</dt><dd>'+esc(r.meaning)+'</dd></div></dl></div>';}
function planTable(list,pri){
  var h='<div class="tw"><table class="tb ov"><thead><tr>'+(pri?'<th>Ưu tiên</th>':'')+'<th>Công việc</th><th>Đầu ra cần đạt</th><th>Phụ trách</th><th>Thời hạn</th>'+(pri?'<th>Phụ thuộc / trạng thái</th>':'')+'</tr></thead><tbody>';
  list.forEach(function(p,i){
    h+='<tr>'+(pri?'<td class="pr"><span class="pri">'+(i+1)+'</span></td>':'')+'<td>'+esc(p.task)+'<small>'+mlab(p.m)+'</small></td><td>'+esc(p.output)+'</td><td>'+who(p.owners)+'</td><td>'+fld(p.due)+'</td>'+(pri?'<td>'+esc(p.dep||'')+'</td>':'')+'</tr>';});
  return h+'</tbody></table></div>';
}
var DC=['var(--hd)','var(--dang)','#ff9f5a','var(--dt)','var(--xong)'];
function srow(m){var o=M[m];
  var h='<button type="button" class="spr" data-open="'+m+'"><span class="spn"><b>'+esc(o.name)+'</b><small>'+esc(o.apps.join(', '))+'</small></span>';
  o.st.forEach(function(s,i){var k=s[0],cls=i===o.cur?'cu':(k==='chua'?'no':(k==='dt'||k==='kh'||k==='cxn'?'pt':(i<o.cur||k==='xong'||k==='hd'?'dn':'no')));
    h+='<span class="sps '+cls+'" style="--dc:'+DC[i]+'" data-tip="'+esc(PH[i]+' · '+S[k][0]+(s[1]?': '+s[1]:''))+'"><b class="d"></b></span>';});
  return h+'<span class="spl">'+esc(o.curLabel)+'</span></button>';}
function bigRing(v,t,c,big){var r=52,C=2*Math.PI*r,p=t?v/t:0;
 return '<svg class="bring" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="'+r+'" fill="none" stroke="var(--rule)" stroke-width="13"/><circle cx="64" cy="64" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 64 64)"/><text x="64" y="70" text-anchor="middle" class="brv">'+big+'</text></svg>';}
function splitRing(a,b,ca,cb,big,small){var r=52,C=2*Math.PI*r,t=a+b||1,pa=a/t*C,pb=b/t*C;
 return '<svg class="bring" viewBox="0 0 128 128" aria-hidden="true">'+(b?'<circle cx="64" cy="64" r="'+r+'" fill="none" stroke="'+cb+'" stroke-width="13" stroke-dasharray="'+Math.max(0,pb-3).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 64 64)"/>':'')+
 (a?'<circle cx="64" cy="64" r="'+r+'" fill="none" stroke="'+ca+'" stroke-width="13" stroke-dasharray="'+Math.max(0,pa-3).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-pb).toFixed(1)+'" transform="rotate(-90 64 64)"/>':'')+
 '<text x="64" y="66" text-anchor="middle" class="brv">'+big+'</text><text x="64" y="84" text-anchor="middle" class="brs">'+small+'</text></svg>';}

/* ========== TRANG 0 · TỔNG QUAN (chỉ số liệu + biểu đồ) ========== */
function pDash(){
  var h='<div class="nums">'+(R.numbers||[]).map(function(n){return '<div class="num" style="--c:'+gcol(n.c)+'"><div class="k">'+esc(n.label)+'</div><div class="v">'+esc(n.value)+'<small>'+esc(n.unit)+'</small></div><div class="s">'+esc(n.sub)+'</div></div>';}).join('')+'</div>';
  var C=R.charts||{},row=[];
  if(C.ring){var r=C.ring,pct=Math.round(r.value/r.total*1000)/10;
    row.push('<section class="card"><h3>'+esc(r.title)+'</h3><p class="cs">'+esc(r.sub)+'</p><div class="rbox">'+bigRing(r.value,r.total,gcol(r.c||'hrm'),pct+'%')+
     '<div class="rleg"><div><i style="background:'+gcol(r.c||'hrm')+'"></i><b>'+r.value+'</b> '+esc(r.doneLabel)+'</div><div><i style="background:var(--rule)"></i><b>'+(r.total-r.value)+'</b> '+esc(r.restLabel||'còn lại')+'</div>'+(r.note?'<div class="rn">'+esc(r.note)+'</div>':'')+'</div></div></section>');}
  if(C.bars){var b=C.bars,mx=Math.max.apply(null,b.items.map(function(x){return x[1];}));
    row.push('<section class="card"><h3>'+esc(b.title)+'</h3><p class="cs">'+esc(b.sub)+'</p><div class="vb">'+b.items.map(function(o){return '<div class="vbc"><b>'+o[1]+'</b><span class="vbb" style="--bc:'+gcol(b.c||'hrm')+';height:'+Math.max(6,o[1]/mx*130)+'px"></span><small>'+esc(o[0])+'</small></div>';}).join('')+'</div></section>');}
  if(PLAN.length&&C.planChart!==false){var nb=PLAN.filter(function(p){return p.owners[0][0]==='b';}).length,nv=PLAN.length-nb;
    row.push('<section class="card"><h3>Đầu việc tuần tới</h3><p class="cs">Theo bên phụ trách chính</p><div class="rbox">'+splitRing(nb,nv,'var(--base)','var(--vtg)',PLAN.length,'đầu việc')+
     '<div class="rleg"><div><i style="background:var(--vtg)"></i><b>'+nv+'</b> '+esc(R.clientTeamLabel||CL)+'</div><div><i style="background:var(--base)"></i><b>'+nb+'</b> Base</div><div class="rn">Chi tiết ở Trang 3</div></div></div></section>');}
  if(row.length)h+='<div class="ch3">'+row.join('')+'</div>';
  var dist=[0,0,0,0,0];MODS.forEach(function(m){dist[M[m].cur]++;});
  h+='<section class="card mb"><div class="chh"><div><h3>Tiến độ theo phân hệ</h3><p class="cs">Vị trí hiện tại của từng phân hệ trên 5 giai đoạn triển khai. Bấm để xem chi tiết.</p></div>'+
   '<div><div class="cs" style="margin:0 0 4px;text-align:right">'+MODS.length+' phân hệ theo giai đoạn đang thực hiện</div><div class="dist">'+dist.map(function(n,i){return n?'<span style="flex:'+n+';background:'+DC[i]+'" data-tip="'+PH[i]+': '+n+' phân hệ">'+n+' '+PHS[i]+'</span>':'';}).join('')+'</div></div></div>'+
   '<div class="sp"><div class="sph"><span></span>'+PH.map(function(p,i){return '<span><i style="background:'+DC[i]+'"></i>'+p+'</span>';}).join('')+'<span>Đang làm</span></div>';
  GROUPS.forEach(function(g){h+='<div class="spg" style="--c:'+gcol(g.c)+'"><i></i>'+esc(g.name)+' <small>'+esc(g.full.replace('Nhóm ',''))+'</small></div>';g.mods.forEach(function(m){h+=srow(m);});});
  if(FOUND)h+='<div class="spg" style="--c:var(--acc)"><i></i>Nền tảng dùng chung</div>'+srow(FOUND);
  h+='</div><div class="sleg"><span><b class="d dn"></b>Đã qua</span><span><b class="d cu"></b>Đang thực hiện</span><span><b class="d pt"></b>Đã làm một phần / đã lên kế hoạch</span><span><b class="d no"></b>Chưa bắt đầu</span></div></section>';
  var bot=[];
  if(C.checks){var k=C.checks;bot.push('<section class="card"><h3>'+esc(k.title)+'</h3><p class="cs">'+esc(k.sub)+'</p><div class="ck">'+k.items.map(function(x){return '<div class="cki"><div class="ckh"><b>'+esc(x[0])+'</b><span class="st" style="--lv:'+S[x[2]][1]+'">'+esc(x[1])+'</span></div><div class="ckb"><span style="width:'+x[3]+'%;background:'+S[x[2]][1]+'"></span></div></div>';}).join('')+'</div>'+(k.note?'<p class="cnote">'+esc(k.note)+'</p>':'')+'</section>');}
  if(C.rollout){var ro=C.rollout,cur=ro.steps.filter(function(s){return s[2]!=='chua';}).length;
    bot.push('<section class="card"><h3>'+esc(ro.title)+'</h3><p class="cs">'+esc(ro.sub)+' · bước '+cur+'/'+ro.steps.length+'</p><div class="ro" style="grid-template-columns:repeat('+ro.steps.length+',minmax(0,1fr))">'+ro.steps.map(function(r,i){return '<div class="rst '+r[2]+'"><span class="rd">'+(r[2]==='xong'?'✓':i+1)+'</span><b>'+esc(r[0])+'</b><small>'+esc(r[1])+'</small></div>';}).join('')+'</div></section>');}
  if(bot.length)h+='<div class="ch2">'+bot.join('')+'</div>';
  h+='<p class="foot">Số liệu do đội triển khai Base cập nhật, tính đến hết '+esc(META.asOf)+'. Diễn giải, vấn đề và kế hoạch chi tiết ở Trang 1 – 3.</p>';
  return h;
}

/* ========== TRANG 1 · CHI TIẾT ========== */
var CUR=R.defaultModule||MODS[0];
function pMod(){
  var h='<p class="upd">Tra cứu theo cấu trúc dự án: nhóm triển khai › phân hệ › hạng mục. Chỉ ghi nhận nội dung có trong biên bản và cập nhật của đội triển khai.</p>';
  h+='<div class="sum2"><section class="card"><h3>Nhận định điều hành</h3>'+(R.summary||[]).map(function(p,i,a){return '<p style="margin:0 0 6px;'+(i===a.length-1&&a.length>1?'font-size:11.5px;color:var(--muted)':'font-size:13px;line-height:1.6')+'">'+rich(p)+'</p>';}).join('')+'</section>'+
   '<section class="card"><h3>Kết quả nổi bật trong tuần</h3><div class="res3" style="margin-top:8px">'+(R.results||[]).map(rs).join('')+'</div></section></div>';
  h+='<section class="card mb"><h3>Ma trận tiến độ</h3><p class="cs">Cột nào chưa có căn cứ được để trống hoặc đánh dấu chưa xác nhận.</p>'+legend()+matrix()+'</section><div class="dw"><nav class="nav" aria-label="Phân hệ">';
  GROUPS.forEach(function(g){h+='<div class="ng2" style="--c:'+gcol(g.c)+'"><i></i>'+esc(g.name)+' · '+esc(g.full.replace('Nhóm ',''))+'</div>';
    g.mods.forEach(function(m){h+='<button type="button" data-m="'+m+'" aria-current="'+(m===CUR)+'">'+esc(M[m].name)+'</button>';});});
  if(FOUND)h+='<div class="ng2" style="--c:var(--acc)"><i></i>Nền tảng dùng chung</div><button type="button" data-m="'+FOUND+'" aria-current="'+(CUR===FOUND)+'">'+esc(M[FOUND].name)+'</button>';
  return h+'</nav><div id="mdet">'+detail(CUR)+'</div></div>';
}
function detail(m){
  var o=M[m],g=gOf(o.g),c=cOf(m);
  var h='<section class="card mb dh" style="--c:'+c+'"><div class="crumb">'+(g?'<b>'+esc(g.name)+'</b> › '+esc(g.full.replace('Nhóm ',''))+' › phân hệ':'<b>Nền tảng dùng chung</b> · không tính là phân hệ triển khai')+'</div><h2>'+esc(o.name)+'</h2><div class="apps">'+o.apps.map(function(a){return '<span>'+esc(a)+'</span>';}).join('')+'</div>'+
   '<div class="now">Trạng thái hiện tại: '+rich(o.now)+'</div><div class="stl">';
  o.st.forEach(function(s,i){var k=s[0];h+='<div class="st5 '+(k==='chua'||k==='cxn'?k:'')+'" style="--lv:'+(S[k][1]||'var(--cxn)')+'"><div class="sn">'+PH[i]+'</div><b>'+S[k][0]+'</b>'+(s[1]?'<small>'+esc(s[1])+'</small>':'')+'</div>';});
  h+='</div><div class="f6">'+bx('Kết quả đã đạt','var(--xong)',o.res)+bx('Đang thực hiện','var(--dang)',o.doing)+bx('Đầu vào còn thiếu / phụ thuộc','var(--cho)',o.miss)+
   '<div class="bx" style="--c:var(--kh)"><h4>Bước tiếp theo</h4><p>'+esc(o.next)+'</p></div><div class="bx" style="--c:var(--gold)"><h4>Phụ trách</h4><p>'+esc(o.own)+'</p></div>'+
   '<div class="bx" style="--c:var(--cxn)"><h4>Thời hạn</h4><p>'+(o.due?esc(o.due):CXN+' <span style="color:var(--muted);font-size:12px">Chưa ghi hạn hoàn thành</span>')+'</p></div></div>';
  var tk=T.filter(function(t){return t.m===m;});
  if(tk.length)h+='<div class="sec">Đầu việc từ biên bản ('+tk.length+')</div>'+taskTable(tk,false);
  return h+'</section>';
  function bx(t,c,l){return '<div class="bx" style="--c:'+c+'"><h4>'+t+'</h4><ul>'+(l&&l.length?l:['Chưa có']).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}
}
function taskTable(list,showMod){
  var h='<div class="tw"><table class="tb" style="min-width:'+(showMod?900:680)+'px"><thead><tr><th>#</th><th>Đầu việc</th><th>Phụ trách</th>'+(showMod?'<th>Phân hệ</th>':'')+'<th>Phát sinh</th><th>Trạng thái</th></tr></thead><tbody>';
  list.forEach(function(t,i){var st=TS[t.st]||TS.open;
    h+='<tr data-g="'+(M[t.m].g||'found')+'" data-side="'+t.side+'" data-st="'+t.st+'"><td class="n">'+(i+1)+'</td><td>'+esc(t.text)+(t.note?'<small>'+esc(t.note)+'</small>':'')+'</td><td class="w"><span class="side '+t.side+'">'+(t.side==='b'?'Base':esc(CL))+'</span>'+(t.side==='b'?'':esc(t.owner))+'</td>'+
     (showMod?'<td>'+mlab(t.m)+'</td>':'')+'<td>'+esc(t.from||'')+'</td><td>'+(st[1]?'<span class="st" style="--lv:'+st[1]+'">'+st[0]+'</span>':'<span class="st q">'+st[0]+'</span>')+'</td></tr>';});
  return h+'</tbody></table><div class="empty" hidden>Không có đầu việc khớp bộ lọc.</div></div>';
}

/* ========== TRANG 2 · VẤN ĐỀ (gộp theo nhóm) ========== */
var F={g:'all',side:'all',st:'all'};
function pIss(){
  var h='<p class="upd">Vấn đề và phụ thuộc gộp theo nhóm triển khai.'+(R.issueNote?' '+esc(R.issueNote):'')+'</p><div class="ig">';
  GROUPS.forEach(function(g){
    var list=ISS.filter(function(x){return (x.group||M[x.m].g||GROUPS[0].id)===g.id;});
    var key=list.filter(function(x){return x.key;}).length;
    h+='<section class="card igc" style="--c:'+gcol(g.c)+'"><div class="igh"><div><h3>'+esc(g.name)+'</h3><p class="cs">'+esc(g.mods.map(function(m){return M[m].name;}).join(', '))+'</p></div><div class="ign"><b>'+list.length+'</b> vấn đề'+(key?' · <span>'+key+' trọng yếu</span>':'')+'</div></div><div class="il">';
    if(!list.length)h+='<div class="empty">Không có vấn đề</div>';
    list.forEach(function(x){
      h+='<div class="ir'+(x.key?' k':'')+'"><div class="irt"><b>'+esc(x.title)+'</b><span class="ism">'+esc(M[x.m].name)+'</span></div><div class="ird">'+esc(x.desc)+'</div>'+
        '<div class="irm"><span><em>Ảnh hưởng</em>'+esc(x.impact)+'</span><span><em>Phụ trách</em>'+esc(x.owner)+'</span><span><em>Hành động</em>'+esc(x.action)+'</span></div>'+
        '<div class="irs">'+(x.status==='Cần xác nhận'?CXN:'<span class="st" style="--lv:'+(x.status==='Đang thực hiện'?'var(--dang)':'var(--cxn)')+'">'+esc(x.status)+'</span>')+'</div></div>';});
    h+='</div></section>';});
  h+='</div><p class="cnote" style="margin:8px 0 0">'+esc(R.issueFootnote||'Hạn xử lý và nhu cầu hỗ trợ từ BOD chưa được hai bên chốt.')+'</p>';
  if(T.length){h+='<details class="more"><summary>Toàn bộ đầu việc từ biên bản <small>'+T.length+' đầu việc · lọc theo nhóm, phía, trạng thái</small></summary><div class="in"><div class="flt"><div class="g"><span>Nhóm</span>'+btn('g','all','Tất cả');
    GROUPS.forEach(function(g){h+=btn('g',g.id,g.name);});if(FOUND)h+=btn('g','found',M[FOUND].name);
    h+='</div><div class="g"><span>Phía</span>'+btn('side','all','Tất cả')+btn('side','b','Base')+btn('side','v',CL)+'</div><div class="g"><span>Trạng thái</span>'+btn('st','all','Tất cả')+btn('st','xong','Đã xử lý')+btn('st','dang','Đang thực hiện')+btn('st','cho','Chờ đầu vào')+btn('st','open','Chưa có cập nhật')+'</div></div>'+taskTable(T,true)+'</div></details>';}
  return h;
  function btn(g,v,l){return '<button type="button" data-f="'+g+'" data-v="'+v+'" aria-pressed="'+(F[g]===v)+'">'+esc(l)+'</button>';}
}
function applyF(){var p=document.getElementById('p-iss'),any=false;
  p.querySelectorAll('tbody tr').forEach(function(r){var ok=(F.g==='all'||r.dataset.g===F.g)&&(F.side==='all'||r.dataset.side===F.side)&&(F.st==='all'||r.dataset.st===F.st);r.hidden=!ok;if(ok)any=true;});
  var e=p.querySelector('.empty');if(e)e.hidden=any;
  p.querySelectorAll('.flt button').forEach(function(b){b.setAttribute('aria-pressed',F[b.dataset.f]===b.dataset.v?'true':'false');});}

/* ========== TRANG 3 · KẾ HOẠCH ========== */
function pPlan(){
  var h='<p class="upd">Lịch làm việc đề xuất cho tuần '+esc(META.nextWeek||'')+', kèm các đầu việc ưu tiên. Thời gian các buổi ở mức đề xuất, chờ '+esc(CL)+' xác nhận.</p>';
  if(MEET.length){
    h+='<section class="card mb"><div class="chh"><div><h3>Lịch làm việc tuần tới</h3><p class="cs">Tuần '+esc(META.nextWeek||'')+' · '+MEET.length+' buổi đề xuất</p></div><span class="prop">Đề xuất · chờ xác nhận</span></div><div class="wk">';
    MEET.forEach(function(m,j){if(m.span)h+='<a class="wm wspan" href="#mts_'+j+'" style="--c:'+gcol(m.c)+'"><span>'+esc(m.time)+'</span><b>'+esc(m.title)+'</b></a>';});
    WEEK.forEach(function(w,i){var ms=MEET.filter(function(m){return m.day===i&&!m.span;});
      h+='<div class="wd'+(ms.length?' on':'')+'"><div class="wdh"><b>'+w[0]+'</b><span>'+w[1]+'</span></div>';
      ms.forEach(function(m,j){h+='<a class="wm" href="#mt'+i+'_'+j+'" style="--c:'+gcol(m.c)+'"><span>'+esc(m.time)+'</span><b>'+esc(m.title)+'</b></a>';});
      if(!ms.length)h+='<div class="wnone">—</div>';h+='</div>';});
    h+='</div></section><div class="mts">';
    var SPW=WEEK.length?[WEEK[0][0]+' – '+WEEK[WEEK.length-1][0],WEEK[0][1].split('/')[0]+' – '+WEEK[WEEK.length-1][1]]:['',''];
    MEET.map(function(m,j){return [m,j];}).filter(function(x){return x[0].span;}).concat(WEEK.reduce(function(a,w,i){return a.concat(MEET.filter(function(m){return m.day===i&&!m.span;}).map(function(m,j){return [m,j,i];}));},[])).forEach(function(x){var m=x[0],j=x[1],i=x[2],w=m.span?SPW:WEEK[i];
      h+='<section class="card mt" id="'+(m.span?'mts_'+j:'mt'+i+'_'+j)+'" style="--c:'+gcol(m.c)+'"><div class="mth"><div class="mtd"><b>'+w[0]+'</b><span>'+w[1]+'</span></div><div><span class="mtg">'+esc(m.tag)+'</span><h3>'+esc(m.title)+'</h3><div class="mtm"><span>'+esc(m.time)+'</span><span>'+fld(m.format)+'</span></div></div></div>'+
       '<dl class="mtl"><div><dt>Thành phần</dt><dd>'+fld(m.who)+'</dd></div><div><dt>Nội dung dự kiến</dt><dd><ul>'+(m.items&&m.items.length?m.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join(''):'<li>'+CXN+'</li>')+'</ul></dd></div>'+(m.prep?'<div><dt>Chuẩn bị trước</dt><dd>'+fld(m.prep)+'</dd></div>':'')+'</dl></section>';});
    h+='</div>';}
  h+='<section class="card mb"><h3>Đầu việc ưu tiên tuần tới</h3><p class="cs">Sắp theo tác động tháo gỡ điểm nghẽn.</p>'+planTable(PLAN,true)+'</section>';
  if(PLAN2.length)h+='<details class="more"><summary>Các đầu việc khác <small>'+PLAN2.length+' đầu việc</small></summary><div class="in">'+planTable(PLAN2,false)+'</div></details>';
  if(SES.length){h+='<details class="more"><summary>Các buổi đã triển khai tuần '+esc(META.period)+' <small>'+SES.length+' buổi</small></summary><div class="in">';
    SES.forEach(function(s){var g=gOf(s.g)||{name:s.tag||'',c:'kh'};h+='<div class="ses" style="--c:'+gcol(g.c)+'"><span class="sd">'+esc(s.date)+'<small>'+esc(s.wd)+'</small></span><span><span class="sg2">'+esc(g.name)+' · '+esc(s.kind)+'</span><br><b>'+esc(s.title)+'</b></span>'+(s.rec?'<a href="'+esc(s.rec)+'" target="_blank" rel="noopener">Record ↗</a>':'<span></span>')+'</div>';});
    h+='</div></details>';}
  return h+'<p class="foot">Đội ngũ triển khai Base.vn tổng hợp. Các mục “Cần xác nhận” sẽ được cập nhật khi hai bên chốt thông tin.</p>';
}

/* ========== DỰNG + TƯƠNG TÁC ========== */
document.getElementById('p-dash').innerHTML=pDash();
document.getElementById('p-mod').innerHTML=pMod();
document.getElementById('p-iss').innerHTML=pIss();
document.getElementById('p-plan').innerHTML=pPlan();
var TABS=['dash','mod','iss','plan'],btns=document.querySelectorAll('.tabs button');
function show(k){if(TABS.indexOf(k)<0)k='dash';TABS.forEach(function(t){document.getElementById('p-'+t).hidden=t!==k;});
  btns.forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===k?'true':'false');});try{sessionStorage.setItem('wpr-tab',k);}catch(e){}}
function openMod(m){CUR=m;document.getElementById('mdet').innerHTML=detail(m);
  document.querySelectorAll('.nav button').forEach(function(b){b.setAttribute('aria-current',b.dataset.m===m?'true':'false');});
  show('mod');var d=document.getElementById('mdet');if(d)d.scrollIntoView({behavior:'smooth',block:'start'});}
btns.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.tab);});});
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-open]');if(o){openMod(o.dataset.open);return;}
  var n=e.target.closest('.nav button');if(n){openMod(n.dataset.m);return;}
  var f=e.target.closest('#p-iss .flt button');if(f){F[f.dataset.f]=f.dataset.v;applyF();}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){var o=e.target.closest&&e.target.closest('tr[data-open]');if(o)openMod(o.dataset.open);}});
var k=location.hash.slice(1);if(TABS.indexOf(k)<0){try{k=sessionStorage.getItem('wpr-tab');}catch(e){}}show(k||'dash');
var tip=null;
document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');
  if(!el){if(tip){tip.remove();tip=null;}return;}
  if(!tip){tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);}
  tip.textContent=el.getAttribute('data-tip');tip.style.left=Math.min(e.clientX+12,innerWidth-290)+'px';tip.style.top=(e.clientY+14)+'px';});
})();

(function(){
  var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,stars=[],met=[];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){var dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);stars=[];
    var n=Math.round(W*H/9000);for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.3,p:Math.random()*6.28,s:Math.random()*.8+.3});if(reduce)frame(0);}
  function spawn(){var a=Math.PI*(.2+Math.random()*.08);met.push({x:Math.random()*W*1.1-W*.2,y:-20,ux:Math.cos(a),uy:Math.sin(a),sp:7+Math.random()*6,len:90+Math.random()*130});}
  function frame(t){x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i];x.globalAlpha=.35+.35*Math.sin(t*.001*s.s+s.p);x.fillStyle='#dfe6ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill();}
    x.globalAlpha=1;if(reduce)return;
    if(Math.random()<.03&&met.length<6)spawn();
    for(var j=met.length-1;j>=0;j--){var m=met[j];m.x+=m.ux*m.sp;m.y+=m.uy*m.sp;var tx=m.x-m.ux*m.len,ty=m.y-m.uy*m.len,g=x.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(140,170,255,0)');x.strokeStyle=g;x.lineWidth=1.6;x.lineCap='round';x.beginPath();x.moveTo(m.x,m.y);x.lineTo(tx,ty);x.stroke();
      if(ty>H||tx>W)met.splice(j,1);}
    requestAnimationFrame(frame);}
  addEventListener('resize',size);size();if(!reduce)requestAnimationFrame(frame);
})();
</script></body></html>
