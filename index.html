<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VINATECH × BASE | Báo cáo tiến độ triển khai theo tuần</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#060b3a;--panel:#0b1450;--card:#121c66;--rule:#2a3690;--text:#fff;--muted:#a9b4ea;--line:#cdd6ff;--gold:#ffd84d;
 --xong:#3ddc97;--hd:#7aa2ff;--dang:#ffb020;--cho:#ff7eb6;--dt:#b48cff;--kh:#5fd4ff;--base:#5fd4ff;--vtg:#ffd84d;--hrm:#12a37f;--work:#8b45f5;--acc:#2f6bff}
:root:not([data-theme="light"]){color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--kh)} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,.tabs,main{position:relative;z-index:1}
header{padding:16px 16px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0 0 4px;font-size:clamp(18px,1.9vw,26px);font-weight:700;letter-spacing:.2px}
.h1-sep{color:#5fd4ff;font-weight:500;margin:0 .15em}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.logos{flex:none;display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;padding:7px 14px}
.logos .vt{font-weight:700;font-size:17px;letter-spacing:.5px;color:#0b2a8a}.logos .vt span{color:#e02424}
.logos img{display:block;height:24px;width:auto}.logos i{width:1px;height:28px;background:#d5daf0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.tabs button{font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:7px 16px;cursor:pointer}
.tabs button:hover{color:var(--text);border-color:var(--line)}
.tabs button[aria-selected="true"]{color:#06103a;background:var(--line);border-color:var(--line)}
.tabs button small{font-weight:500;opacity:.75;margin-left:6px}
main{padding:12px 16px 40px;font-size:13px;max-width:1400px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;min-width:0}
.sec{margin-bottom:18px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sh h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.sh h2 .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#06103a;font-size:13px}
.sh small{color:var(--muted);font-size:12px}
.tag{font-size:10.5px;font-weight:700;color:var(--c)}
/* sessions */
.ses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.se{border-top:3px solid var(--c);display:flex;flex-direction:column;gap:8px}
.seh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.dt{text-align:center;padding:6px 10px;border-radius:9px;background:var(--card);border:1px solid var(--rule);min-width:58px}
.dt b{display:block;font-size:15px}.dt span{display:block;font-size:11.5px;color:var(--gold);font-weight:700}
.seh h3{margin:2px 0 0;font-size:14px;line-height:1.3}
.se ul{margin:0;padding-left:17px;display:grid;gap:4px;font-size:12.5px}
.rec{margin-top:auto;font-size:12px;font-weight:600;text-decoration:none}
.rec:hover{text-decoration:underline}
/* progress */
.grp{margin-bottom:14px}
.gh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0 0 8px}
.gh i{width:4px;height:16px;border-radius:2px;background:var(--c)}
.gh small{font-weight:500;color:var(--muted);font-size:12px}
.mods{display:grid;grid-template-columns:1fr;gap:8px}
.md h3{margin:0;font-size:14px}.md .ap{font-size:11px;color:var(--muted);margin:2px 0 10px}
.trk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:10px}
.stp{position:relative;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.25;padding:0 2px}
.stp::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--rule)}
.stp:first-child::before{display:none}
.stp.dn::before,.stp.cu::before{background:var(--hd)}
.d{position:relative;z-index:1;display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--rule);margin:2px 0 4px}
.stp.dn .d{background:var(--hd);border-color:var(--hd)}
.stp.cu .d{width:20px;height:20px;margin:-1px 0 1px;background:var(--dang);border-color:#fff;box-shadow:0 0 0 4px rgba(255,176,32,.28)}
.stp.pt .d{background:linear-gradient(90deg,var(--dt) 50%,var(--bg) 50%);border-color:var(--dt)}
.stp.cu{color:var(--text);font-weight:600}
.cur{font-size:12px;margin:0;padding:6px 10px;border-radius:8px;background:rgba(255,176,32,.12);border-left:3px solid var(--dang)}
.cur b{color:var(--dang)}
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fx div{min-width:0}
.fx dt{font-size:11px;font-weight:700;margin-bottom:4px;color:var(--fc)}
.fx ul{margin:0;padding-left:15px;display:grid;gap:3px;font-size:12px}
.fx .none{font-size:12px;color:var(--muted)}
.sleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted);margin:0 0 10px}
.sleg span{display:inline-flex;align-items:center;gap:6px}
.sleg .d{margin:0}
.sleg .d.cu{width:14px;height:14px;background:var(--dang);border-color:#fff}
.sleg .d.dn{background:var(--hd);border-color:var(--hd)}
.sleg .d.pt{background:linear-gradient(90deg,var(--dt) 50%,var(--bg) 50%);border-color:var(--dt)}
/* plan */
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wd{background:rgba(255,255,255,.03);border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:96px;min-width:0}
.wd.on{border-color:var(--line)}
.wdh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wdh b{font-size:14px}.wdh span{font-size:12px;color:var(--gold);font-weight:700}
.wm{display:block;color:var(--text);padding:7px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 22%,var(--card));border-left:3px solid var(--c)}
.wm span{display:block;font-size:10.5px;font-weight:700;color:var(--c)}
.wm b{display:block;font-size:12px;line-height:1.3;margin-top:2px}
.wspan{grid-column:1/-1}
.wnone{color:var(--rule);font-size:12px;text-align:center;padding-top:14px}
.mts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:12px 0}
.mt{border-top:3px solid var(--c)}
.mt h3{margin:2px 0 4px;font-size:14px}
.mtm{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.mt dl{margin:0;display:grid;gap:8px;font-size:12.5px}
.mt dt{font-size:11px;color:var(--muted);margin-bottom:2px}.mt dd{margin:0}
.mt ul{margin:0;padding-left:16px;display:grid;gap:2px}
.tk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tk h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.side{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;color:#06103a}
.side.b{background:var(--base)}.side.v{background:var(--vtg)}
.tki{padding:8px 0;border-top:1px solid var(--rule);font-size:12.5px}
.tki:first-of-type{border-top:0}
.tki small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.tki small .tag{margin-right:6px}
.iss{padding:10px 0;border-top:1px solid var(--rule);font-size:12.5px}
.tkg h4+.iss{border-top:0}
.iss b{display:block;font-size:13px;margin-bottom:3px}
.iss p{margin:0 0 6px;color:var(--muted)}
.iss dl{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.iss dt{font-size:10.5px;color:var(--muted)}.iss dd{margin:0;font-size:12px}
@media (max-width:520px){.iss dl{grid-template-columns:1fr}}
.foot{font-size:11.5px;color:var(--muted);margin-top:16px}
.stabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--rule)}
.stabs button{font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.stabs button:hover{color:var(--text)}
.stabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:14px;padding:12px 16px;min-width:0}
.kpi .k{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:34px;font-weight:700;line-height:1.05;margin:6px 0 2px;color:var(--c)}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .sc{font-size:11.5px;color:var(--muted)}
details.md{display:block;padding:0}
details.md>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(200px,1fr) minmax(360px,2fr) minmax(180px,1fr) 20px;gap:14px;align-items:center;padding:10px 14px}
details.md>summary::-webkit-details-marker{display:none}
details.md>summary::after{content:"+";font-size:18px;color:var(--muted);text-align:right}
details.md[open]>summary::after{content:"–"}
details.md>summary h3{margin:0;font-size:13.5px}details.md>summary .ap{margin:2px 0 0}
details.md .trk{margin:0}
details.md .cl{font-size:12px;color:var(--dang);font-weight:600}
details.md .fx{padding:4px 14px 14px;border-top:1px solid var(--rule);padding-top:12px}
.tkg{margin-bottom:6px}
.tkg h4{margin:10px 0 2px;font-size:11.5px;color:var(--c);text-transform:uppercase;letter-spacing:.4px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){details.md>summary{grid-template-columns:1fr 20px}details.md>summary .trk,details.md>summary .cl{grid-column:1}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
@media (max-width:860px){.wk{grid-template-columns:repeat(3,minmax(0,1fr))}.tk{grid-template-columns:1fr}}
@media (max-width:520px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}.fx{grid-template-columns:1fr}.ses,.mts{grid-template-columns:1fr}}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}#sky,.tabs{display:none}}
</style></head><body>

function lst(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<span class="none">—</span>';}
function modCard(M,id){var m=M[id];
  return '<details class="card md"><summary><div><h3>'+esc(m.name)+'</h3><p class="ap">'+esc(m.apps.join(', '))+'</p></div>'+track(m)+'<div class="cl">'+esc(m.curLabel)+'</div></summary>'+
   '<dl class="fx"><div style="--fc:var(--xong)"><dt>Đã làm</dt><dd>'+lst(m.done)+'</dd></div><div style="--fc:var(--dang)"><dt>Đang làm</dt><dd>'+lst(m.doing)+'</dd></div><div style="--fc:var(--cho)"><dt>Còn chờ</dt><dd>'+lst(m.wait)+'</dd></div></dl></details>';}
function kpis(w){return '<div class="kpis">'+w.numbers.map(function(n){return '<div class="kpi" style="--c:'+COL[n.c]+'"><div class="k">'+esc(n.label)+'</div><div class="v">'+esc(n.value)+'<small>'+esc(n.unit)+'</small></div><div class="sc">'+esc(n.sub)+'</div></div>';}).join('')+'</div>';}
function progress(w){var M=w.modules,h='<div class="sleg"><span><b class="d dn"></b>Đã qua</span><span><b class="d cu"></b>Đang thực hiện</span><span><b class="d pt"></b>Đã làm một phần / đã lên kế hoạch</span><span><b class="d"></b>Chưa bắt đầu</span><span>· Bấm vào phân hệ để xem chi tiết</span></div>';
  R.groups.forEach(function(g){h+='<div class="grp"><div class="gh" style="--c:'+COL[g.c]+'"><i></i>'+esc(g.name)+'<small>'+esc(g.full)+' · '+g.mods.length+' phân hệ</small></div><div class="mods">'+g.mods.map(function(id){return modCard(M,id);}).join('')+'</div></div>';});
  if(R.foundation&&M[R.foundation])h+='<div class="grp"><div class="gh" style="--c:var(--acc)"><i></i>Nền tảng dùng chung</div><div class="mods">'+modCard(M,R.foundation)+'</div></div>';
  return h;}
function plan(w){var M=w.modules,h='<section class="card"><div class="wk">';
  var SPW=[w.week[0][0]+' – '+w.week[w.week.length-1][0],w.week[0][1].split('/')[0]+' – '+w.week[w.week.length-1][1]];
  w.meetings.forEach(function(m){if(m.span)h+='<div class="wm wspan" style="--c:'+COL[m.c]+'"><span>'+esc(m.time)+'</span><b>'+esc(m.title)+'</b></div>';});
  w.week.forEach(function(d,i){var ms=w.meetings.filter(function(m){return m.day===i&&!m.span;});
    h+='<div class="wd'+(ms.length?' on':'')+'"><div class="wdh"><b>'+d[0]+'</b><span>'+d[1]+'</span></div>'+ms.map(function(m){return '<div class="wm" style="--c:'+COL[m.c]+'"><span>'+esc(m.time)+'</span><b>'+esc(m.title)+'</b></div>';}).join('')+(ms.length?'':'<div class="wnone">—</div>')+'</div>';});
  h+='</div></section><div class="mts">';
  var order=w.meetings.filter(function(m){return m.span;}).concat(w.meetings.filter(function(m){return !m.span;}).sort(function(a,b){return a.day-b.day;}));
  order.forEach(function(m){var d=m.span?SPW:w.week[m.day];
    h+='<section class="card mt" style="--c:'+COL[m.c]+'"><span class="tag">'+esc(m.tag)+' · '+esc(d[0])+' '+esc(d[1])+'</span><h3>'+esc(m.title)+'</h3><div class="mtm">'+esc(m.time)+(m.format?' · '+esc(m.format):'')+'</div><dl>'+
     (m.who?'<div><dt>Thành phần</dt><dd>'+esc(m.who)+'</dd></div>':'')+
     '<div><dt>Nội dung</dt><dd><ul>'+(m.items||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></dd></div>'+
     (m.prep?'<div><dt>Chuẩn bị trước</dt><dd>'+esc(m.prep)+'</dd></div>':'')+'</dl></section>';});
  return h;}
function tasks(w){var M=w.modules,h='<div class="tk">';
  [['b','Base']].forEach(function(sd){var it=w.plan.filter(function(p){return p.side===sd[0];});
    h+='<section class="card"><h3><span class="side '+sd[0]+'">'+esc(sd[1])+'</span>'+it.length+' đầu việc</h3>';
    R.groups.concat([{id:null,name:'Nền tảng dùng chung',c:'acc'}]).forEach(function(g){var gi=it.filter(function(p){return M[p.m].g===g.id;});if(!gi.length)return;
      h+='<div class="tkg" style="--c:'+COL[g.c]+'"><h4>'+esc(g.name)+'</h4>'+gi.map(function(p){
      return '<div class="tki">'+esc(p.task)+'<small><span class="tag" style="--c:'+mcol(M,p.m)+'">'+esc(M[p.m].name)+'</span>'+(sd[0]==='v'?esc(p.owner):'')+(p.due?' · Hạn '+esc(p.due):'')+'</small></div>';}).join('')+'</div>';});
    h+='</section>';});
  h+='<section class="card"><h3><span class="side v">'+esc(R.clientShort)+'</span>'+w.issues.length+' việc cần tập trung</h3>';
  R.groups.forEach(function(g){var gi=w.issues.filter(function(x){return (x.group||M[x.m].g)===g.id;});if(!gi.length)return;
    h+='<div class="tkg" style="--c:'+COL[g.c]+'"><h4>'+esc(g.name)+'</h4>'+gi.map(function(x){
      return '<div class="iss"><b>'+esc(x.title)+' <span class="tag" style="--c:'+mcol(M,x.m)+'">'+esc(M[x.m].name)+'</span></b><p>'+esc(x.desc)+'</p><dl><div><dt>Ảnh hưởng</dt><dd>'+esc(x.impact)+'</dd></div><div><dt>Phụ trách</dt><dd>'+esc(x.owner)+'</dd></div><div><dt>Việc cần làm</dt><dd>'+esc(x.action)+'</dd></div></dl></div>';}).join('')+'</div>';});
  h+='</section>';
  return h+'</div>';}
var tabs=document.getElementById('tabs'),main=document.getElementById('main');
var SUB=[['ov','Tổng quan'],['ses','Buổi triển khai'],['tk','Đầu việc tiếp theo'],['cal','Lịch buổi triển khai tiếp theo']],CURW=R.weeks[0].id,CURS='ov';
R.weeks.forEach(function(w,i){
  tabs.insertAdjacentHTML('beforeend','<button type="button" role="tab" data-w="'+w.id+'">'+esc(w.label)+(i===0?'<small>mới nhất</small>':'')+'</button>');
  var c={ov:'<div class="sh"><h2>Số liệu chung</h2><small>Tuần '+esc(w.period)+'</small></div>'+kpis(w)+'<div class="sh"><h2>Tiến độ các bộ giải pháp</h2><small>Tính đến hết tuần '+esc(w.period)+'</small></div>'+progress(w),
    ses:'<div class="sh"><h2>Các buổi đã triển khai</h2><small>'+esc(w.period)+' · '+w.sessions.length+' buổi</small></div>'+sessions(w),
    tk:'<div class="sh"><h2>Đầu việc tiếp theo</h2><small>Tuần '+esc(w.nextWeek)+'</small></div>'+tasks(w),
    cal:'<div class="sh"><h2>Lịch buổi triển khai tiếp theo</h2><small>Tuần '+esc(w.nextWeek)+'</small></div>'+plan(w)};
  main.insertAdjacentHTML('beforeend','<section role="tabpanel" id="p-'+w.id+'" hidden><nav class="stabs" role="tablist">'+SUB.map(function(t){return '<button type="button" role="tab" data-s="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</nav>'+
   SUB.map(function(t){return '<div class="sp" data-s="'+t[0]+'" hidden>'+c[t[0]]+'</div>';}).join('')+'</section>');});
function show(){[].forEach.call(tabs.children,function(b){b.setAttribute('aria-selected',b.dataset.w===CURW);});
  [].forEach.call(main.children,function(p){p.hidden=p.id!=='p-'+CURW;
    [].forEach.call(p.querySelectorAll('.stabs button'),function(b){b.setAttribute('aria-selected',b.dataset.s===CURS);});
    [].forEach.call(p.querySelectorAll('.sp'),function(d){d.hidden=d.dataset.s!==CURS;});});}
tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(b){CURW=b.dataset.w;show();}});
main.addEventListener('click',function(e){var b=e.target.closest('.stabs button');if(b){CURS=b.dataset.s;show();}});
show();

(function(){
  var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,stars=[],met=[];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){var dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);stars=[];
    var n=Math.round(W*H/9000);for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.3,p:Math.random()*6.28,s:Math.random()*.8+.3});if(reduce)frame(0);}
  function spawn(){var a=Math.PI*(.2+Math.random()*.08);met.push({x:Math.random()*W*1.1-W*.2,y:-20,ux:Math.cos(a),uy:Math.sin(a),sp:7+Math.random()*6,len:90+Math.random()*130});}
  function frame(t){x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i];x.globalAlpha=.35+.35*Math.sin(t*.001*s.s+s.p);x.fillStyle='#dfe6ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill();}
    x.globalAlpha=1;if(reduce)return;
    if(Math.random()<.03&&met.length<6)spawn();
    for(var j=met.length-1;j>=0;j--){var m=met[j];m.x+=m.ux*m.sp;m.y+=m.uy*m.sp;var tx=m.x-m.ux*m.len,ty=m.y-m.uy*m.len,g=x.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(140,170,255,0)');x.strokeStyle=g;x.lineWidth=1.6;x.lineCap='round';x.beginPath();x.moveTo(m.x,m.y);x.lineTo(tx,ty);x.stroke();
      if(ty>H||tx>W)met.splice(j,1);}
    requestAnimationFrame(frame);}
  addEventListener('resize',size);size();if(!reduce)requestAnimationFrame(frame);
})();
</script></body></html>
